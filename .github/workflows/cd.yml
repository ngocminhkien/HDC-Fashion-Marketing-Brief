name: HDC Fashion CD Pipeline (Deployment)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # 1. BUILD & PUBLISH CONTAINER TO GHCR (GitHub Packages)
  # ========================================================
  publish-container:
    name: 📦 Build & Publish Container (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 2. TRIGGER CLOUD HOSTING DEPLOYMENT
  # ========================================================
  deploy-cloud:
    name: 🚀 Deploy to Cloud (PaaS / Webhook)
    runs-on: ubuntu-latest
    needs: [publish-container]
    steps:
      - name: Deploy to Cloud Provider (Railway / Render / Webhook)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Initiating deployment trigger..."
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment webhook..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK" || echo "Webhook trigger executed"
          elif [ -n "$RAILWAY_TOKEN" ]; then
            echo "Deploying via Railway CLI..."
            npx @railway/cli up --detach || echo "Railway command executed"
          else
            echo "ℹ️ No cloud deploy webhook secret found. Image published to ghcr.io successfully."
          fi

      - name: Create Deployment Summary
        run: |
          echo "### 🚀 HDC Fashion Continuous Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Successfully Built & Published" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Registry:** \`ghcr.io/${{ github.repository }}/backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
