name: HDC Fashion CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # 1. FRONTEND INTEGRITY & SYNTAX CHECK
  # ========================================================
  frontend-check:
    name: 🎨 Frontend Lint & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Frontend JavaScript Syntax
        run: |
          echo "Verifying JavaScript files for syntax errors..."
          node scripts/check-frontend-syntax.js
          echo "✅ All frontend JavaScript files passed syntax validation."

      - name: Validate JSON Configuration Files
        run: |
          echo "Verifying JSON configuration files..."
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          echo "✅ JSON files are valid."

  # ========================================================
  # 2. BACKEND AUTOMATED TEST & LINT MATRIX
  # ========================================================
  backend-test:
    name: ⚙️ Backend Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    # Service containers for real DB & Cache integration
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hdc_user
          POSTGRES_PASSWORD: hdc_secure_password
          POSTGRES_DB: hdc_fashion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: |
          npm ci || npm install

      - name: Run Backend Syntax & Linter Check
        run: |
          npm run lint

      - name: Execute Automated Test Suite (Unit & Integration)
        env:
          NODE_ENV: test
          PORT: 5001
          DATABASE_URL: postgresql://hdc_user:hdc_secure_password@localhost:5432/hdc_fashion_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_key_ci_environment_2026
        run: |
          npm run test:ci

      - name: Run Dependency Vulnerability Audit
        run: |
          npm audit --audit-level=high || echo "⚠️ Non-critical vulnerabilities found, review audit log."

  # ========================================================
  # 3. DOCKER CONTAINER BUILD VERIFICATION
  # ========================================================
  docker-build:
    name: 🐳 Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: hdc-fashion-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Image Build
        run: |
          echo "✅ Backend Docker image built successfully with multi-stage Alpine target."
